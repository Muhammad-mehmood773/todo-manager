<nz-card nzTitle="Completed Todos" [nzBordered]="true" class="todo-card">
  @if (todoService.completedTodos().length > 0) {
    <div class="todo-list">
      @for (todo of todoService.completedTodos(); track todo.id) {
        <div class="todo-item">
          <span class="todo-title">
            <i
              class="bi bi-trash2-fill text-danger fs-5 p-2 m-2"
              (click)="todoService.remove(todo.id)">
            </i>
            {{ todo.title }}
          </span>
          <label
            nz-checkbox
            [(ngModel)]="todo.isCompleted"
            (ngModelChange)="todoService.toggle(todo, $event)">
          </label>
        </div>
      }
    </div>
  } @else {
    <nz-empty   nzNotFoundImage="https://gw.alipayobjects.com/zos/antfincdn/ZHrcdLPrvN/empty.svg"
     [nzNotFoundContent]="'No complete Todos Found'"></nz-empty>
  }
</nz-card>
